<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gustav Thormod Nielsen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500&family=Merriweather:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --white:       #FFFFFF;
      --off-white:   #F6F6F6;
      --light-grey:  #E4E4E4;
      --mid-grey:    #9A9A9A;
      --dark-grey:   #2C2C2C;
      --black:       #111111;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Merriweather', Georgia, serif;
      background: var(--off-white);
      color: var(--dark-grey);
      overflow-x: hidden;
    }

    /* ─── NAV ─────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 52px;
      background: var(--off-white);
    }

    nav::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 52px;
      right: 52px;
      height: 1px;
      background: var(--light-grey);
    }

    .nav-name {
      font-family: 'Raleway', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dark-grey);
      text-decoration: none;
    }

    .nav-links {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      font-family: 'Raleway', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--mid-grey);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--dark-grey); }

    .nav-cta {
      font-family: 'Raleway', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--off-white);
      text-decoration: none;
      background: #4D6AB0;
      border: 1px solid #4D6AB0;
      padding: 8px 20px;
      transition: all 0.2s;
    }
    .nav-cta:hover { background: #3d5490; border-color: #3d5490; color: var(--off-white); }

    /* ─── HERO ────────────────────────────────────────────────── */
#hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--white);
    }

    #three-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ─── PROJECT INFO OVERLAY ────────────────────────────────── */
    #project-info {
      position: absolute;
      bottom: 128px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .proj-cat {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 10px;
    }

    .proj-title {
      font-family: 'Raleway', sans-serif;
      font-size: 36px;
      font-weight: 300;
      letter-spacing: -0.025em;
      color: var(--dark-grey);
      margin-bottom: 6px;
    }

    .proj-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 0;
    }

    .proj-year {
      font-size: 12px;
      color: var(--mid-grey);
      letter-spacing: 0.04em;
    }

    .proj-title-wrap {
      text-align: center;
      margin-bottom: 6px;
    }

    .proj-title-anchor {
      display: inline-block;
      position: relative;
    }

    .proj-version {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--mid-grey);
      border: 1px solid var(--light-grey);
      padding: 2px 8px;
      white-space: nowrap;
    }

    .pv-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .pv-header-version {
      font-family: 'Raleway', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--mid-grey);
      border: 1px solid var(--light-grey);
      padding: 3px 10px;
      flex-shrink: 0;
    }

    #view-btn {
      display: inline-block;
      margin-top: 20px;
      font-family: 'Raleway', sans-serif;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--mid-grey);
      background: none; border: 1px solid var(--light-grey);
      cursor: pointer; padding: 10px 24px;
      pointer-events: all;
      transition: all 0.2s;
    }

    #view-btn:hover { color: var(--dark-grey); border-color: var(--dark-grey); }

    #scroll-hint {
      display: inline-block;
      margin-top: 20px;
      font-family: 'Raleway', sans-serif;
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--mid-grey);
      cursor: pointer;
      pointer-events: all;
      animation: nudge 2.4s ease-in-out infinite;
    }

    @keyframes nudge {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50%       { transform: translateY(4px); opacity: 1; }
    }

    #wip-badge {
      display: none;
      margin-top: 20px;
      font-family: 'Raleway', sans-serif;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--mid-grey);
      border: 1px solid var(--light-grey);
      padding: 10px 24px;
    }

    /* ─── CAROUSEL ARROWS ─────────────────────────────────────── */
    .c-arrow {
      position: absolute;
      bottom: 170px;
      z-index: 10;
      background: none;
      border: none;
      cursor: pointer;
      padding: 20px;
      color: var(--dark-grey);
      opacity: 0.3;
      font-size: 20px;
      font-family: inherit;
      line-height: 1;
      transition: opacity 0.2s;
      user-select: none;
    }
    .c-arrow:hover { opacity: 0.9; }
    .c-arrow.left  { left: calc(50% - 430px); }
    .c-arrow.right { right: calc(50% - 430px); }

    /* ─── DOTS ────────────────────────────────────────────────── */
    #dots {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--light-grey);
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    .dot.active { background: var(--dark-grey); transform: scale(1.4); }

    /* ─── SCROLL HINT ─────────────────────────────────────────── */
    .scroll-hint {
      position: absolute;
      bottom: 36px;
      right: 52px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mid-grey);
      z-index: 10;
    }

    /* ─── SECTIONS ────────────────────────────────────────────── */
    .section-wrap {
      max-width: 1160px;
      margin: 0 auto;
      padding: 110px 52px;
      border-top: 1px solid var(--light-grey);
    }

    .section-label {
      font-family: 'Raleway', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 56px;
    }

    /* ─── ABOUT ───────────────────────────────────────────────── */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 96px;
      align-items: start;
    }

    .about-h {
      font-family: 'Raleway', sans-serif;
      font-size: 38px;
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--dark-grey);
      margin-bottom: 32px;
    }

    .about-p {
      font-size: 15px;
      font-weight: 300;
      line-height: 1.85;
      color: var(--mid-grey);
      margin-bottom: 14px;
    }

    .details-stack {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .detail-item label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 5px;
    }

    .detail-item span,
    .detail-item a {
      font-size: 14px;
      font-weight: 400;
      color: var(--dark-grey);
      text-decoration: none;
    }

    .detail-item a:hover { text-decoration: underline; }

    /* ─── CV ──────────────────────────────────────────────────── */
    .cv-row {
      display: grid;
      grid-template-columns: 130px 1fr 90px;
      gap: 40px;
      padding: 28px 0;
      border-bottom: 1px solid var(--light-grey);
      align-items: start;
    }
    .cv-row:first-child { border-top: 1px solid var(--light-grey); }

    .cv-year  { font-size: 12px; color: var(--mid-grey); padding-top: 2px; }
    .cv-role  { font-family: 'Raleway', sans-serif; font-size: 15px; font-weight: 400; color: var(--dark-grey); margin-bottom: 4px; }
    .cv-place { font-size: 13px; font-weight: 300; color: var(--mid-grey); }
    .cv-type  {
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--mid-grey); text-align: right; padding-top: 3px;
    }

    /* ─── CONTACT ─────────────────────────────────────────────── */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 96px;
      align-items: end;
    }

    .contact-h {
      font-family: 'Raleway', sans-serif;
      font-size: 52px;
      font-weight: 300;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--dark-grey);
    }

    .contact-links { display: flex; flex-direction: column; gap: 24px; }

    .c-link label {
      display: block;
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 5px;
    }

    .c-link a {
      font-size: 14px; color: var(--dark-grey);
      text-decoration: none; transition: color 0.2s;
    }
    .c-link a:hover { color: var(--mid-grey); }

    /* ─── FOOTER ──────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--light-grey);
      padding: 28px 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 100%;
    }
    footer span { font-size: 11px; color: var(--mid-grey); }

    /* ─── DETAIL SECTION ─────────────────────────────────────── */
    #detail-section {
      display: flex;
      border-top: 1px solid var(--light-grey);
    }

    .ds-left {
      position: sticky;
      top: 56px;
      width: 50%;
      height: calc(100vh - 56px);
      flex-shrink: 0;
    }

    #ds-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ds-right {
      width: 50%;
      min-height: calc(100vh - 56px);
      border-left: 1px solid var(--light-grey);
      display: flex;
      flex-direction: column;
    }

    .ds-header {
      padding: 140px 48px 32px;
      border-bottom: 1px solid var(--light-grey);
      position: sticky;
      top: 56px;
      background: var(--off-white);
      z-index: 10;
    }

    .ds-header-cat {
      font-family: 'Raleway', sans-serif;
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 10px;
    }

    .ds-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .ds-header-title {
      font-family: 'Raleway', sans-serif;
      font-size: 30px; font-weight: 300;
      letter-spacing: -0.025em;
      color: var(--dark-grey);
    }

    .ds-header-version {
      font-family: 'Raleway', sans-serif;
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--mid-grey);
      border: 1px solid var(--light-grey);
      padding: 3px 10px;
      flex-shrink: 0;
    }

    .ds-content {
      padding: 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .ds-block-label {
      font-family: 'Raleway', sans-serif;
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 14px;
    }

    .ds-block p {
      font-size: 14px; font-weight: 300;
      line-height: 1.85; color: var(--mid-grey);
    }

    .ds-img-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--light-grey);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Raleway', sans-serif;
      font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--mid-grey);
    }

    .ds-video-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--dark-grey);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Raleway', sans-serif;
      font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--mid-grey);
    }

    .ds-img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .ds-video {
      width: 100%;
      display: block;
      background: #000;
    }

    .ds-wip-msg {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Raleway', sans-serif;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--mid-grey);
    }

    /* ─── FOOTER ──────────────────────────────────────────────── */
    #site-footer {
      border-top: 1px solid var(--light-grey);
      padding: 28px 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #site-footer span { font-size: 11px; color: var(--mid-grey); }

    #back-top {
      position: absolute;
      bottom: 32px;
      right: 32px;
      font-family: 'Raleway', sans-serif;
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--mid-grey);
      cursor: pointer;
      background: none; border: none;
      padding: 0;
      animation: nudge-up 2.4s ease-in-out infinite;
    }

    @keyframes nudge-up {
      0%, 100% { transform: translateY(0);   opacity: 0.5; }
      50%       { transform: translateY(-4px); opacity: 1; }
    }
  </style>
</head>

    <!-- Left: sticky model -->
    <div class="ds-left">
      <canvas id="ds-canvas"></canvas>
      <button id="back-top">↑ Back to Top</button>
    </div>

    <!-- Right: project content -->
    <div class="ds-right">

      <div class="ds-header">
        <div class="ds-header-cat" id="ds-cat"></div>
        <div class="ds-title-row">
          <div class="ds-header-title" id="ds-title"></div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer id="site-footer">
    <span>Gustav Thormod Nielsen</span>
    <span>© 2025</span>
  </footer>

    /* ── RENDERER ──────────────────────────────────────────────── */

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

    /* ── SCENE ─────────────────────────────────────────────────── */

    /* ── CAMERA ────────────────────────────────────────────────── */
    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.8, 11);
    camera.lookAt(0, 0.2, 0);

    /* ── LIGHTS ────────────────────────────────────────────────── */
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.75);
    sunLight.position.set(5, 10, 7);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far  = 40;
    sunLight.shadow.camera.left = sunLight.shadow.camera.bottom = -10;
    sunLight.shadow.camera.right = sunLight.shadow.camera.top   =  10;
    scene.add(sunLight);

    // Soft fill from below-front
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.25);
    fillLight.position.set(-3, -2, 8);
    scene.add(fillLight);

    // Selection spot (follows selected item)
    const selSpot = new THREE.SpotLight(0xffffff, 0, 12, Math.PI / 7, 0.4, 1);
    selSpot.castShadow = false;
    scene.add(selSpot);
    scene.add(selSpot.target);

    // Under-glow for selected base
    const baseGlow = new THREE.PointLight(0xffffff, 0, 3.5, 2);
    scene.add(baseGlow);

    /* ── FLOOR ─────────────────────────────────────────────────── */
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({ color: 0xF6F6F6, roughness: 1, metalness: 0 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.98;
    floor.receiveShadow = true;
    scene.add(floor);

    /* ── DRAG HIT ZONE (invisible cylinder over carousel) ─────── */
    const dragZone = new THREE.Mesh(
      new THREE.CylinderGeometry(7, 7, 1.8, 32),
      new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })
    );
    dragZone.position.set(0, 2.3, 0); // bottom at y=1.4, 1.8 units tall
    scene.add(dragZone);

    /* ── PLATFORM RING ─────────────────────────────────────────── */
    const platform = new THREE.Mesh(
      new THREE.RingGeometry(5, 7, 128),
      new THREE.MeshStandardMaterial({
        color:     0xC0C0C0,
        roughness: 0.95,
        metalness: 0.0,
        side:      THREE.DoubleSide,
      })
    );
    platform.rotation.x = -Math.PI / 2;
    platform.position.y = 1.0;
    platform.receiveShadow = true;
    scene.add(platform);

    /* ── CAROUSEL ──────────────────────────────────────────────── */
    const RADIUS = 5.8;
    const carousel = new THREE.Group();
    carousel.position.y = 1.0;
    scene.add(carousel);

    // Placeholder geometries — one per project
    const geos = [
      new THREE.CylinderGeometry(0.18, 0.32, 1.6, 32),
      new THREE.BoxGeometry(0.85, 1.35, 0.85),
      new THREE.IcosahedronGeometry(0.72, 1),
      new THREE.CylinderGeometry(0.35, 0.58, 1.45, 7),
      new THREE.BoxGeometry(0.95, 1.2, 0.95),
      new THREE.OctahedronGeometry(0.72),
      new THREE.CylinderGeometry(0.6, 0.6, 1.1, 32),
      new THREE.BoxGeometry(1.1, 0.7, 0.6),
      new THREE.ConeGeometry(0.55, 1.4, 6),
      new THREE.TorusGeometry(0.55, 0.22, 12, 48),
    ];

    const items = PROJECTS.map((proj, i) => {
      const group = new THREE.Group();

      /* invisible placeholders — kept so animation refs don't break */
      const baseMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.88, 0.88, 0.036, 72),
        new THREE.MeshStandardMaterial({ visible: false })
      );
      baseMesh.receiveShadow = true;
      group.add(baseMesh);

      const ringMesh = new THREE.Mesh(
        new THREE.TorusGeometry(0.88, 0.016, 8, 80),
        new THREE.MeshStandardMaterial({ visible: false })
      );
      ringMesh.rotation.x = Math.PI / 2;
      ringMesh.position.y = 0.018;
      group.add(ringMesh);

      /* main object */
      let objMesh;
      if (proj.title === 'Personal Site') {
        // Thin sheet with site screenshot on front, noise on back
        const loader = new THREE.TextureLoader();
        const frontTex = loader.load('site_screenshot.png');
        const backTex  = loader.load('noise_picture.jpg');
        const sheetGeo = new THREE.BoxGeometry(1.6, 1.0, 0.04);
        const mats = [
          new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4, metalness: 0.1 }), // +X
          new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4, metalness: 0.1 }), // -X
          new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4, metalness: 0.1 }), // +Y
          new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4, metalness: 0.1 }), // -Y
          new THREE.MeshStandardMaterial({ map: frontTex, roughness: 0.3, metalness: 0.0 }),   // +Z front
          new THREE.MeshStandardMaterial({ map: backTex,  roughness: 0.5, metalness: 0.0 }),   // -Z back
        ];
        objMesh = new THREE.Mesh(sheetGeo, mats);
      } else {
        objMesh = new THREE.Mesh(
          geos[i],
          new THREE.MeshStandardMaterial({
            color:     proj.wip ? 0x080808 : 0xBEBEBE,
            roughness: proj.wip ? 0.97 : 0.12,
            metalness: proj.wip ? 0.0  : 0.65,
          })
        );
      }
      objMesh.position.y = 0.9;
      objMesh.castShadow = true;
      group.add(objMesh);

      /* place on circle */
      const angle = i * STEP;
      group.position.set(Math.sin(angle) * RADIUS, 0, Math.cos(angle) * RADIUS);
      group.rotation.y = -angle; // face center

      carousel.add(group);

      return { group, baseMesh, ringMesh, objMesh, proj,
               baseAngle: angle,
               baseY: 0.9, scale: new THREE.Vector3(1, 1, 1) };
    });

    /* ── DOTS ──────────────────────────────────────────────────── */
    const dotsEl = document.getElementById('dots');
    const dotEls = PROJECTS.map((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
      return d;
    });

    function refreshDots() {
      dotEls.forEach((d, i) => d.className = 'dot' + (i === currentIdx ? ' active' : ''));
    }

    /* ── INFO OVERLAY ──────────────────────────────────────────── */
    const infoEl    = document.getElementById('project-info');
    const titleEl   = document.getElementById('proj-title');

    const scrollHint = document.getElementById('scroll-hint');
    function smoothScroll(target, duration) {
      const start    = window.scrollY;
      const distance = target - start;
      let startTime  = null;
      function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
      document.documentElement.style.scrollBehavior = 'auto';
      function step(ts) {
        if (!startTime) startTime = ts;
        const elapsed = Math.min((ts - startTime) / duration, 1);
        window.scrollTo(0, start + distance * ease(elapsed));
        if (elapsed < 1) requestAnimationFrame(step);
        else document.documentElement.style.scrollBehavior = '';
      }
      requestAnimationFrame(step);
    }

    document.getElementById('back-top').addEventListener('click', () => smoothScroll(0, 750));

    scrollHint.addEventListener('click', () => {
      const target = document.getElementById('detail-section').getBoundingClientRect().top + window.scrollY - 56;
      smoothScroll(target, 750);
    });
    const versionEl  = document.getElementById('proj-version');

    function refreshInfo(idx, instant) {
      const p = PROJECTS[idx];
      const apply = () => {
        titleEl.textContent   = p.title;
        versionEl.textContent = p.version;
      };
      if (instant) {
        apply();
      } else {
        infoEl.style.opacity = '0';
        setTimeout(() => { apply(); infoEl.style.opacity = '1'; }, 220);
      }
    }

    refreshInfo(0, true);

    /* detail section is populated after items + renderer are set up — see below */

    /* ── HIGHLIGHT FADE ─────────────────────────────────────────── */
    let hlIntensity  = 1;   // current 0→1 multiplier
    let hlDelayTimer = 0;   // counts up after a switch
    let hlWaiting    = false; // true while in the 0.25s delay

    /* ── NAVIGATION ────────────────────────────────────────────── */
    function goTo(idx) {
      if (idx === currentIdx) return;
      const fwd = ((idx - currentIdx) + N) % N;
      const bwd = ((currentIdx - idx) + N) % N;
      spinTarget += fwd <= bwd ? -(fwd * STEP) : (bwd * STEP);
      currentIdx = idx;
      refreshDots();
      refreshInfo(idx, false);
      updateDetailSection(idx);
      // Reset highlight for fade-in after delay
      hlIntensity  = 0;
      hlDelayTimer = 0;
      hlWaiting    = true;
    }

    document.getElementById('prev-btn').addEventListener('click', () => goTo((currentIdx - 1 + N) % N));
    document.getElementById('next-btn').addEventListener('click', () => goTo((currentIdx + 1) % N));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  goTo((currentIdx - 1 + N) % N);
      if (e.key === 'ArrowRight') goTo((currentIdx + 1) % N);
    });

    /* ── DETAIL SECTION RENDERER ───────────────────────────────── */
    const dsCanvas = document.getElementById('ds-canvas');
    const dsRenderer = new THREE.WebGLRenderer({ canvas: dsCanvas, antialias: true });
    dsRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    dsRenderer.setClearColor(0xF6F6F6, 1);

    const dsScene = new THREE.Scene();
    dsScene.background = new THREE.Color(0xF6F6F6);

    const dsCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    dsCam.position.set(0, 0.5, 4.5);
    dsCam.lookAt(0, 0, 0);

    dsScene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dsSun = new THREE.DirectionalLight(0xffffff, 0.8);
    dsSun.position.set(3, 5, 5);
    dsScene.add(dsSun);

    let dsModelRef   = null;
    let dsClock2     = 0;
    let dsVelX       = -0.006; // horizontal (Y-axis) — eases back to auto-spin
    let dsVelY       = 0;      // vertical (X-axis)   — eases back to 0
    let dsIsDragging = false;
    let dsDragLastX  = 0;
    let dsDragLastY  = 0;

    const _qH = new THREE.Quaternion();
    const _qV = new THREE.Quaternion();
    const _axisY = new THREE.Vector3(0, 1, 0);
    const _axisX = new THREE.Vector3(1, 0, 0);

    function applyDsRotation(velH, velV) {
      _qH.setFromAxisAngle(_axisY, velH);
      _qV.setFromAxisAngle(_axisX, velV);
      dsModelRef.quaternion.premultiply(_qH).premultiply(_qV);
    }

    function sizeDs() {
      const w = dsCanvas.clientWidth;
      const h = dsCanvas.clientHeight;
      dsRenderer.setSize(w, h, false);
      dsCam.aspect = w / h;
      dsCam.updateProjectionMatrix();
    }
    sizeDs();
    window.addEventListener('resize', sizeDs);

    function dsLoop() {
      requestAnimationFrame(dsLoop);
      dsClock2 += 0.016;
      if (dsModelRef) {
        if (!dsIsDragging) {
          dsVelX += (-0.006 - dsVelX) * 0.03; // ease horizontal back to auto-spin
          dsVelY *= 0.92;                       // decay vertical toward level
          applyDsRotation(dsVelX, dsVelY);
        }
        dsModelRef.position.y = Math.sin(dsClock2 * 1.6) * 0.08;
      }
      dsRenderer.render(dsScene, dsCam);
    }
    dsLoop();

    // Mouse drag
    dsCanvas.style.cursor = 'grab';
    dsCanvas.addEventListener('mousedown', (e) => {
      dsIsDragging = true;
      dsDragLastX  = e.clientX;
      dsDragLastY  = e.clientY;
      dsVelX = dsVelY = 0;
      dsCanvas.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
      if (!dsIsDragging || !dsModelRef) return;
      dsVelX = (e.clientX - dsDragLastX) * 0.012;
      dsVelY = (e.clientY - dsDragLastY) * 0.012;
      applyDsRotation(dsVelX, dsVelY);
      dsDragLastX = e.clientX;
      dsDragLastY = e.clientY;
    });
    window.addEventListener('mouseup', () => {
      if (!dsIsDragging) return;
      dsIsDragging = false;
      dsCanvas.style.cursor = 'grab';
    });

    // Touch drag
    dsCanvas.addEventListener('touchstart', (e) => {
      dsIsDragging = true;
      dsDragLastX  = e.touches[0].clientX;
      dsDragLastY  = e.touches[0].clientY;
      dsVelX = dsVelY = 0;
    }, { passive: true });
    dsCanvas.addEventListener('touchmove', (e) => {
      if (!dsIsDragging || !dsModelRef) return;
      dsVelX = (e.touches[0].clientX - dsDragLastX) * 0.012;
      dsVelY = (e.touches[0].clientY - dsDragLastY) * 0.012;
      applyDsRotation(dsVelX, dsVelY);
      dsDragLastX = e.touches[0].clientX;
      dsDragLastY = e.touches[0].clientY;
    }, { passive: true });
    dsCanvas.addEventListener('touchend', () => { dsIsDragging = false; });

    function updateDetailSection(idx) {
      const p = PROJECTS[idx];
      document.getElementById('ds-cat').textContent     = p.cat + ' — ' + p.year;
      document.getElementById('ds-title').textContent   = p.title;
      document.getElementById('ds-version').textContent = p.version;

      const contentEl = document.getElementById('ds-content');
      const wipEl     = document.getElementById('ds-wip-msg');

      if (p.wip) {
        contentEl.style.display = 'none';
        wipEl.style.display     = 'flex';
      } else {
        contentEl.style.display = 'flex';
        wipEl.style.display     = 'none';

        // Build content dynamically
        const hasMedia = (p.images && p.images.length) || (p.videos && p.videos.length);
        let html = '';

        // Overview block
        html += `<div class="ds-block">
          <div class="ds-block-label">Overview</div>
          <p>${p.desc || 'Placeholder — replace with your real project description and process notes.'}</p>
        </div>`;

        if (hasMedia) {
          // Images
          if (p.images && p.images.length) {
            p.images.forEach(src => {
              html += `<div class="ds-block">
                <img class="ds-img" src="${encodeURI(src)}" alt="" loading="lazy">
              </div>`;
            });
          }
          // Videos
          if (p.videos && p.videos.length) {
            p.videos.forEach(src => {
              html += `<div class="ds-block">
                <video class="ds-video" src="${encodeURI(src)}" controls playsinline></video>
              </div>`;
            });
          }
        } else {
          // Placeholders for projects with no media yet
          html += `<div class="ds-block">
            <div class="ds-img-placeholder">Image / Photo</div>
          </div>
          <div class="ds-block">
            <div class="ds-video-placeholder">▶ Video</div>
          </div>`;
        }

        contentEl.innerHTML = html;
      }

      if (dsModelRef) dsScene.remove(dsModelRef);
      dsModelRef = items[idx].objMesh.clone();
      dsModelRef.position.set(0, 0, 0);
      dsModelRef.quaternion.identity();
      dsVelX = -0.006;
      dsVelY = 0;
      dsScene.add(dsModelRef);
    }

    /* ── ANIMATION LOOP ────────────────────────────────────────── */
    let clock = 0;
    const tmpVec = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      clock += 0.015;

      /* smooth carousel spin */
      spinCurrent += (spinTarget - spinCurrent) * 0.07;
      carousel.rotation.y = spinCurrent;

      /* update each item */
      items.forEach((item, i) => {
        const selected = i === currentIdx;

        /* float + slow self-rotation */
        const floatY = item.baseY + (selected ? Math.sin(clock * 1.6) * 0.06 : 0);
        item.objMesh.position.y = floatY;
        item.objMesh.rotation.y -= selected ? 0.006 : 0.0018;

        /* scale */
        const ts = selected ? 1.07 : 0.93;
        item.group.scale.lerp(tmpVec.set(ts, ts, ts), 0.06);

        /* base + ring glow */
        if (!item.proj.wip) {
          const glow = selected ? (0.28 + Math.sin(clock * 2.2) * 0.06) : 0;
          item.baseMesh.material.emissiveIntensity = glow;
          item.ringMesh.material.emissiveIntensity = selected ? glow * 2 : 0;
        }
      });


      /* move selection spotlight to selected item world position */
      const sel = items[currentIdx];
      sel.group.getWorldPosition(tmpVec);
      selSpot.position.set(tmpVec.x, tmpVec.y + 7, tmpVec.z + 2);
      selSpot.target.position.copy(tmpVec);
      // Highlight fade: 0.25s delay then 0.5s linear fade-in
      if (hlWaiting) {
        hlDelayTimer += 0.016;
        if (hlDelayTimer >= 0.5) hlWaiting = false;
      } else {
        hlIntensity = Math.min(1, hlIntensity + 0.016 / 0.5);
      }

      selSpot.intensity = sel.proj.wip ? 0 : 0.338 * hlIntensity;

      baseGlow.position.set(tmpVec.x, tmpVec.y + 0.4, tmpVec.z);
      baseGlow.intensity = sel.proj.wip ? 0 : 0.225 * hlIntensity;

      renderer.render(scene, camera);
    }

    animate();
    updateDetailSection(0);

    /* ── LOAD GLB MODELS ───────────────────────────────────────── */
    const gltfLoader = new THREE.GLTFLoader();

    // Helper: load a GLB, centre it in a pivot group, optional X tilt
    // The animation loop drives pivot.position.y and pivot.rotation.y,
    // so centering the model inside the pivot fixes the off-axis spin.
    function loadModel(file, slotIndex, tiltX = 0) {
      gltfLoader.load(file, (gltf) => {
        const item  = items[slotIndex];
        const model = gltf.scene;
        const pivot = new THREE.Group();

        item.group.remove(item.objMesh);

        // Normalise to a consistent display size
        const box    = new THREE.Box3().setFromObject(model);
        const size   = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        model.scale.setScalar(1.2 / maxDim);

        // Re-measure after scaling and centre model inside pivot
        box.setFromObject(model);
        const centre = box.getCenter(new THREE.Vector3());
        model.position.set(-centre.x, -centre.y, -centre.z);

        // Optional tilt (radians)
        model.rotation.x = tiltX;

        model.traverse(child => { if (child.isMesh) child.castShadow = true; });

        pivot.add(model);
        item.group.add(pivot);
        item.objMesh = pivot; // animation loop now spins & floats the pivot
      });
    }

    loadModel('blue_cube.glb',      0);                   // slot 0 — no tilt
    loadModel('Conrete_Dish.glb',   1, Math.PI / 6);      // slot 1 — 30° tilt
    loadModel('Red_Concrete_Dish.glb', 2, Math.PI / 6);   // slot 2 — 30° tilt (test)

    /* ── DRAG NAVIGATION ───────────────────────────────────────── */
    let dragStartX  = null;
    let dragMoved   = false;
    const DRAG_THRESHOLD = 45;

    function onDragEnd(endX) {
      const delta = endX - dragStartX;
      if (Math.abs(delta) > DRAG_THRESHOLD) {
        delta < 0 ? goTo((currentIdx + 1) % N)
                  : goTo((currentIdx - 1 + N) % N);
      }
      dragStartX = null;
    }

    function inDragZone(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const mx =  ((clientX - rect.left) / rect.width)  * 2 - 1;
      const my = -((clientY - rect.top)  / rect.height) * 2 + 1;
      const zoneRay = new THREE.Raycaster();
      zoneRay.setFromCamera(new THREE.Vector2(mx, my), camera);
      return zoneRay.intersectObject(dragZone).length > 0;
    }

    canvas.addEventListener('mousedown', (e) => {
      if (!inDragZone(e.clientX, e.clientY)) return;
      dragStartX = e.clientX;
      dragMoved  = false;
      canvas.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
      if (dragStartX === null) return;
      if (Math.abs(e.clientX - dragStartX) > 4) dragMoved = true;
    });
    window.addEventListener('mouseup', (e) => {
      if (dragStartX === null) return;
      onDragEnd(e.clientX);
    });

    canvas.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (!inDragZone(t.clientX, t.clientY)) return;
      dragStartX = t.clientX;
      dragMoved  = false;
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
      if (dragStartX === null) return;
      if (Math.abs(e.touches[0].clientX - dragStartX) > 4) dragMoved = true;
    }, { passive: true });
    canvas.addEventListener('touchend', (e) => {
      if (dragStartX === null) return;
      onDragEnd(e.changedTouches[0].clientX);
    });

    /* ── MODEL CLICK ───────────────────────────────────────────── */
    const raycaster = new THREE.Raycaster();
    const mouse     = new THREE.Vector2();

    function getCarouselMeshes() {
      const meshes = [];
      items.forEach(item => item.group.traverse(child => {
        if (child.isMesh) meshes.push(child);
      }));
      return meshes;
    }

    canvas.addEventListener('mousemove', (e) => {
      if (dragStartX !== null) return; // dragging — skip hover check
      if (!inDragZone(e.clientX, e.clientY)) { canvas.style.cursor = 'default'; return; }
      const rect = canvas.getBoundingClientRect();
      mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hit = raycaster.intersectObjects(getCarouselMeshes()).length > 0;
      canvas.style.cursor = hit ? 'pointer' : 'grab';
    });

    canvas.addEventListener('click', (e) => {
      if (dragMoved) { dragMoved = false; return; } // was a drag, not a tap
      const rect = canvas.getBoundingClientRect();
      mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(getCarouselMeshes());
      if (intersects.length === 0) return;

      // Find which carousel item owns the hit mesh
      const hitMesh = intersects[0].object;
      let clickedIdx = -1;
      items.forEach((item, i) => {
        item.group.traverse(child => { if (child === hitMesh) clickedIdx = i; });
      });
      if (clickedIdx === -1) return;

      if (clickedIdx === currentIdx) {
        // Already selected — scroll to detail view
        const target = document.getElementById('detail-section').getBoundingClientRect().top + window.scrollY - 56;
        smoothScroll(target, 750);
      } else {
        // Different model — spin carousel to it
        goTo(clickedIdx);
      }
      canvas.style.cursor = 'grab';
    });

    /* ── RESIZE ────────────────────────────────────────────────── */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      sizeDs();
    });
  </script>
</body>
</html>
